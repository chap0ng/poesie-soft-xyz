<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=nacelle@100,200,300,400,500&display=swap" rel="stylesheet">
    
    <!-- styles -->
    <!-- Core stylesheets -->
    <link rel="stylesheet" href="styles/core/variables.css">
    <link rel="stylesheet" href="styles/core/reset.css">
    <link rel="stylesheet" href="styles/core/base.css">

    <!-- Components -->
    <link rel="stylesheet" href="styles/general/header.css">
    <link rel="stylesheet" href="styles/general/footer.css">
    <link rel="stylesheet" href="styles/general/tags.css">
    <link rel="stylesheet" href="styles/general/modal-carousel.css">

    <!-- page specific -->

    <style>
        .lang-btn.uninitialized { opacity: 0; pointer-events: none; }
    </style>
    <script>
        (function() {
            try {
                const lang = localStorage.getItem('lang') || 'en';
                window.__langPref = lang;
            } catch(e) {}
        })();
    </script>
</head>
<body>

    <header class="header">
        <a href="index.html" class="back-link" data-en="&#8592;" data-fr="&#8592;">&#8592;</a>
        <h1 class="page-title" data-en="3D WORKS" data-fr="PRATIQUE 3D">3DWorks</h1>
            <div class="lang-switch">
                <button class="lang-btn uninitialized active" id="lang-en">EN</button>
                <span class="separator">/</span>
                <button class="lang-btn uninitialized" id="lang-fr">FR</button>
            </div>
    </header>

    <div class="scrolling-text-container">
        <div class="scrolling-text">
            <span class="scroll-inner" data-en="&nbsp;3D MODELING • RENDER TESTS • MATERIAL STUDIES • LIGHTING • SCENE BUILDING • PROTOTYPES • " data-fr="&nbsp;MODÉLISATION 3D • TESTS DE RENDU • ÉTUDES DE MATÉRIAUX • LUMIÈRE • CRÉATION DE SCÈNES • PROTOTYPES • ">&nbsp;3D MODELING • RENDER TESTS • MATERIAL STUDIES • LIGHTING • SCENE BUILDING • PROTOTYPES • </span>
        </div>
    </div>

    <main class="main">
        <div class="container">

            <section class="intro-section">
                <pre class="ascii-creature">
o    o     __ __
 \  /    '       `
  |/   /     __    \
(`  \ '    '    \   '
  \  \|   |   @_/   |
   \   \   \       /--/
    ` ___ ___ ___ __ '
                </pre>
                <div class="intro-spacer" aria-hidden="true"></div>
                <div class="tag-filter-container">
                    <button class="tag-filter-btn tag-filter-all active" data-tag="all" data-en="All Projects" data-fr="Tous les projets">All Projects</button>
                </div>
            </section>

            <section class="projects-section">
                <div class="projects-grid" id="projects-grid">
                    <!-- Projects will be populated here by JavaScript -->
                </div>
            </section>

        </div>
    </main>

    <script>
        // Render 3D projects on page load
        document.addEventListener('DOMContentLoaded', () => {
            renderProjectsFromData('threeD', 'projects-grid');
        });
    </script>

    <script src="../Js/header.js" defer></script>
    <script src="../Js/fine-arts.js"></script>
</body>
</html>
