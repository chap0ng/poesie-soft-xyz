    <style>
        .lang-btn.uninitialized { opacity: 0; pointer-events: none; }
    </style>
    <script>
        (function() {
            try {
                const lang = localStorage.getItem('lang') || 'en';
                
                // Update text content immediately
                document.querySelectorAll('[data-en]').forEach(el => {
                    const text = lang === 'fr' 
                        ? el.getAttribute('data-fr')
                        : el.getAttribute('data-en');
                    if (text !== null) el.textContent = text;
                });
                
                // Store language preference for later use
                window.__langPref = lang;
            } catch(e) {}
        })();
    </script>
</head>
<body>

    <header class="header">
        <a href="index.html" class="back-link" data-en="&#8592;" data-fr="&#8592;">&#8592;</a>
        <h1 class="page-title" data-en="CONTACT" data-fr="CONTACT">CONTACT</h1>
        <div class="lang-switch">
            <button class="lang-btn uninitialized active" id="lang-en">EN</button>
            <span class="separator">/</span>
            <button class="lang-btn uninitialized" id="lang-fr">FR</button>
        </div>
    </header>

    <main class="main">

                <div class="about-section">

                    <h2 class="about-section-title">
                    <span data-en="Mail" data-fr="Mail">
                        Mail
                    </span>
                    </h2>

                    <p class="intro-description about-copy" 
                       data-en-html="" 
                       data-fr-html="">
                       <a class='bio-link bio-color' 
                       href='mailto:Chap0ng@outlook.fr' 
                       target='_blank' 
                       rel='noopener noreferrer'
                       >Chap0ng@outlook.fr
                    </a>
                    </p>
                </div>

                <div class="about-section">

                    <h2 class="about-section-title">
                    <span data-en="Links" data-fr="Liens">
                        Links
                    </span>
                    </h2>

                    <p class="intro-description about-copy" 
                       data-en-html="" 
                       data-fr-html="">
                       <a class='bio-link bio-color' 
                       href='https://linktr.ee/chap0ng?utm_source=linktree_profile_share&ltsid=e0fc254c-bce4-4820-a2d3-05e42981af9c' 
                       target='_blank' 
                       rel='noopener noreferrer'
                       > →  →  →  →
                    </a>
                    </p>
                </div>

            </section>
        </div>
    </main>

    <script src="../Js/header.js"></script>
</body>
</html>
